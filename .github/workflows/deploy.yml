name: Deploy Servana API (Prod)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Copy secrets
        run: |
          cp /home/github-runner/env/servana_api.env .env
          chmod 600 .env

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restart PM2
        run: |
          PM2_BIN=$(which pm2 2>/dev/null || echo /usr/local/bin/pm2)
          sudo "$PM2_BIN" delete servana-prod 2>/dev/null; true
          sudo "$PM2_BIN" start "$(pwd)/dist/app.js" --name servana-prod
          sudo "$PM2_BIN" save

      - name: Reload NGINX
        run: sudo systemctl reload nginx
