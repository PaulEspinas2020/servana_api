name: Deploy Servana API (Prod)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, x64]
    timeout-minutes: 12

    steps:
      - name: Fix workspace permissions
        run: |
          sudo chown -R github-runner:github-runner "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy secrets
        run: |
          cp /home/github-runner/env/servana_api.env .env
          chmod 600 .env
          cp /home/github-runner/env/servana-serviceAccountKey.json servana-serviceAccountKey.json
          chmod 600 servana-serviceAccountKey.json

      # Fails loudly rather than silently authenticating with a burned password.
      # The literal fallback that used to live on the PGPASSWORD line below was
      # the production Postgres password in plaintext, committed and pushed.
      # 9e06a73 ("fallback DB_PASSWORD so migrations run before secret is
      # configured") added it, undoing ce92fb5 ("DB password to secret") — so
      # the hardening was reverted for convenience and then forgotten.
      - name: Require DB_PASSWORD secret
        run: |
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "::error::DB_PASSWORD repo secret is not set."
            echo "Set it under Settings > Secrets and variables > Actions."
            echo "There is deliberately no fallback: the previous literal was"
            echo "the production password in plaintext and is now rotated."
            exit 1
          fi

      - name: Run pending DB migrations
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          DONE_DIR="/home/github-runner/migrations-done"
          mkdir -p "$DONE_DIR"

          # 001 was superseded by 002 — mark done so it never runs again
          touch "$DONE_DIR/001-massage-services.done"

          DONE_FILE="$DONE_DIR/002-massage-specific-services.done"
          if [ ! -f "$DONE_FILE" ]; then
            echo "Running migration 002-massage-specific-services..."
            if psql -h 127.0.0.1 -U admin -d servana -f ./scripts/migrations/002-massage-specific-services.sql; then
              touch "$DONE_FILE"
              echo "Migration 002-massage-specific-services: DONE"
            else
              echo "Migration 002-massage-specific-services: FAILED"
              exit 1
            fi
          else
            echo "Migration 002-massage-specific-services: already applied, skipping"
          fi

          DONE_FILE="$DONE_DIR/003-nail-services.done"
          if [ ! -f "$DONE_FILE" ]; then
            echo "Running migration 003-nail-services..."
            if psql -h 127.0.0.1 -U admin -d servana -f ./scripts/migrations/003-nail-services.sql; then
              touch "$DONE_FILE"
              echo "Migration 003-nail-services: DONE"
            else
              echo "Migration 003-nail-services: FAILED"
              exit 1
            fi
          else
            echo "Migration 003-nail-services: already applied, skipping"
          fi

          DONE_FILE="$DONE_DIR/004-hair-barber-services.done"
          if [ ! -f "$DONE_FILE" ]; then
            echo "Running migration 004-hair-barber-services..."
            if psql -h 127.0.0.1 -U admin -d servana -f ./scripts/migrations/004-hair-barber-services.sql; then
              touch "$DONE_FILE"
              echo "Migration 004-hair-barber-services: DONE"
            else
              echo "Migration 004-hair-barber-services: FAILED"
              exit 1
            fi
          else
            echo "Migration 004-hair-barber-services: already applied, skipping"
          fi

          DONE_FILE="$DONE_DIR/005-beauty-services.done"
          if [ ! -f "$DONE_FILE" ]; then
            echo "Running migration 005-beauty-services..."
            if psql -h 127.0.0.1 -U admin -d servana -f ./scripts/migrations/005-beauty-services.sql; then
              touch "$DONE_FILE"
              echo "Migration 005-beauty-services: DONE"
            else
              echo "Migration 005-beauty-services: FAILED"
              exit 1
            fi
          else
            echo "Migration 005-beauty-services: already applied, skipping"
          fi

          DONE_FILE="$DONE_DIR/006-beauty-catalog-description.done"
          if [ ! -f "$DONE_FILE" ]; then
            echo "Running migration 006-beauty-catalog-description..."
            if psql -h 127.0.0.1 -U admin -d servana -f ./scripts/migrations/006-beauty-catalog-description.sql; then
              touch "$DONE_FILE"
              echo "Migration 006-beauty-catalog-description: DONE"
            else
              echo "Migration 006-beauty-catalog-description: FAILED"
              exit 1
            fi
          else
            echo "Migration 006-beauty-catalog-description: already applied, skipping"
          fi

          DONE_FILE="$DONE_DIR/007-aircon-cleaning-services.done"
          if [ ! -f "$DONE_FILE" ]; then
            echo "Running migration 007-aircon-cleaning-services..."
            if psql -h 127.0.0.1 -U admin -d servana -f ./scripts/migrations/007-aircon-cleaning-services.sql; then
              touch "$DONE_FILE"
              echo "Migration 007-aircon-cleaning-services: DONE"
            else
              echo "Migration 007-aircon-cleaning-services: FAILED"
              exit 1
            fi
          else
            echo "Migration 007-aircon-cleaning-services: already applied, skipping"
          fi

          DONE_FILE="$DONE_DIR/008-aircon-installation-repair-services.done"
          if [ ! -f "$DONE_FILE" ]; then
            echo "Running migration 008-aircon-installation-repair-services..."
            if psql -h 127.0.0.1 -U admin -d servana -f ./scripts/migrations/008-aircon-installation-repair-services.sql; then
              touch "$DONE_FILE"
              echo "Migration 008-aircon-installation-repair-services: DONE"
            else
              echo "Migration 008-aircon-installation-repair-services: FAILED"
              exit 1
            fi
          else
            echo "Migration 008-aircon-installation-repair-services: already applied, skipping"
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      - name: Restart PM2
        run: |
          APP="$(pwd)/dist/app.js"
          sudo /usr/bin/pm2 stop servana-prod 2>/dev/null || true
          sudo /usr/bin/pm2 delete servana-prod 2>/dev/null || true
          sudo /usr/bin/pm2 start "$APP" --name servana-prod
          sudo /usr/bin/pm2 save --force

      - name: Reload NGINX
        run: sudo systemctl reload nginx
