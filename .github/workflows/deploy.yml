name: Deploy Servana API (Prod)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, x64]

    steps:
      - name: Pull latest code into app directory
        run: |
          cd /root/servana_api
          git fetch origin main
          git reset --hard origin/main

      - name: Copy secrets
        run: |
          cp /home/github-runner/env/servana_api.env /root/servana_api/.env
          chmod 600 /root/servana_api/.env

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd /root/servana_api
          npm ci

      - name: Build
        run: |
          cd /root/servana_api
          npm run build

      - name: Restart PM2
        run: |
          pm2 describe servana-prod >/dev/null 2>&1 \
            && pm2 restart servana-prod \
            || pm2 start /root/servana_api/dist/app.js --name servana-prod
          pm2 save

      - name: Reload NGINX
        run: sudo systemctl reload nginx
