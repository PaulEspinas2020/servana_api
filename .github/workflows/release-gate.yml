# The release gate (TAB 01).
#
# One job, one command, one artifact. The gate's verdict is whatever
# `npm run release:summary` writes — this workflow does not re-derive it, because
# a CI job that computes its own answer becomes a second definition of
# releasable and then the two disagree at the worst moment.
#
# The summary is retained whether the gate passes or fails. A failed run is the
# one you most want the artifact from, and `if: always()` is what makes that
# true rather than aspirational.

name: release-gate

# ⛔ MANUAL ONLY — GitHub Actions credit for this repo is exhausted and is not
# being topped up (owner decision, 2026-08-19). Every job below is
# `ubuntu-latest`, i.e. GitHub-hosted, so it cannot run: an automatic trigger
# would just queue a run that fails and leaves a red X that means nothing.
#
# `deploy.yml` is unaffected and still deploys on push to main — it targets the
# self-hosted runner, which does not consume Actions minutes.
#
# Nothing here is deleted. Restore the automatic trigger by putting back
#     push:
#       branches: [main]
#     pull_request:
# above `workflow_dispatch`. Until then the real gate is `npm run verify`,
# enforced locally by scripts/hooks/pre-push.
on:
  workflow_dispatch:

jobs:
  gate:
    name: hermetic release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Generated-document and OpenAPI drift. Separate from the summary because
      # these fail on CONTENT, and their diff is the useful output.
      - name: Generated document drift
        # CORRECTION. An earlier version of this block blamed the JS heap and set
        # --max-old-space-size, inferred from a run whose log for this step was
        # missing. That inference was WRONG, and run 32161440209 - which did log -
        # says what actually happens:
        #
        #   Firebase Admin credentials not found.
        #     at src/middleware/firebaseApp.ts:25
        #     at src/middleware/verifyAuth.ts:2
        #     at src/api/v1/register.ts:36
        #     at src/app.ts:205
        #     at tests/app-import-is-inert.test.ts:63
        #   Test Suites: 4 failed, 272 passed    Tests: 7 failed, 5903 passed
        #
        # Not memory. Not drift. 4 suites need Firebase Admin credentials, which
        # exist on the self-hosted deploy host (deploy.yml copies
        # servana-serviceAccountKey.json out of /home/github-runner/env) and do
        # not exist on a GitHub-hosted runner. That is also why `npm run verify`
        # is green locally and red here: the difference is credentials, not load.
        #
        # Worth noting what the failing suite is called: app-import-is-inert.
        # Importing src/app.ts is NOT inert without credentials, so that test is
        # reporting a real property of the app, not a CI misconfiguration.
        #
        # Two ways to close it, neither done here: supply the service account as
        # an Actions secret, or make firebaseApp.ts defer credential resolution
        # so a bare import cannot throw. The second is the one the test is asking
        # for by name.
        run: npm run verify

      # Dependency review is REPORTING, not blocking, and deliberately so.
      #
      # There are 9 moderate advisories today whose fixes are major bumps of
      # firebase-admin (the auth path) and node-cron (every scheduled job).
      # Making this blocking would either force those bumps under deadline
      # pressure or get the step deleted the first time it went red — and a
      # deleted gate reports nothing forever.
      #
      # `--audit-level=high` so a HIGH or CRITICAL is what surfaces; the
      # moderates are already tracked. Promote to blocking once they are cleared.
      - name: Dependency advisories (reporting)
        continue-on-error: true
        run: npm run security:deps

      # The SECRET scan is blocking, and it runs inside `npm run verify` too.
      # Named separately here so a failure reads as a secret leak rather than as
      # "the test suite failed".
      - name: Secret scan (blocking)
        run: npm run security:secrets

      - name: Release summary
        # if: always() so the summary exists even when the gate above failed.
        # Without it this step was SKIPPED on any failure, which meant the
        # artifact could never exist for a failed run - the exact opposite of
        # what this file's header promises ("The summary is retained whether the
        # gate passes or fails"). The upload below then failed too, manufacturing
        # a second red X that pointed at the artifact instead of the real cause.
        if: always()
        run: npm run release:summary

      - name: Retain the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: reports/release-summary.json
          # warn, not error: a missing summary is a SYMPTOM of an earlier
          # failure, and turning it into its own failure buries the cause.
          if-no-files-found: warn
          retention-days: 30

      # The gate must not leave anything behind in a tracked directory.
      # `tests/release-gate-hermeticity.test.ts` asserts this statically; this
      # proves it dynamically, on a real clean checkout.
      - name: Working tree is still clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the gate wrote into the working tree:"
            git status --porcelain
            exit 1
          fi
