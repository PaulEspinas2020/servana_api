# The release gate (TAB 01).
#
# One job, one command, one artifact. The gate's verdict is whatever
# `npm run release:summary` writes — this workflow does not re-derive it, because
# a CI job that computes its own answer becomes a second definition of
# releasable and then the two disagree at the worst moment.
#
# The summary is retained whether the gate passes or fails. A failed run is the
# one you most want the artifact from, and `if: always()` is what makes that
# true rather than aspirational.

name: release-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable, so `deploy.yml` can depend on this gate as a JOB (TAB 03, F-03).
  #
  # Two workflows on the same trigger run in parallel and can never express a
  # dependency between them, which is how run 32119165094 (this gate, FAILURE)
  # and run 32119165101 (the deploy, SUCCESS) both happened on d4b0150. The gate
  # was red and the commit shipped. `workflow_call` is what lets the deploy say
  # `needs: [release-gate]` and mean it.
  workflow_call:

jobs:
  gate:
    name: hermetic release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Generated-document and OpenAPI drift. Separate from the summary because
      # these fail on CONTENT, and their diff is the useful output.
      - name: Generated document drift
        run: npm run verify

      # Dependency review is REPORTING, not blocking, and deliberately so.
      #
      # There are 9 moderate advisories today whose fixes are major bumps of
      # firebase-admin (the auth path) and node-cron (every scheduled job).
      # Making this blocking would either force those bumps under deadline
      # pressure or get the step deleted the first time it went red — and a
      # deleted gate reports nothing forever.
      #
      # `--audit-level=high` so a HIGH or CRITICAL is what surfaces; the
      # moderates are already tracked. Promote to blocking once they are cleared.
      - name: Dependency advisories (reporting)
        continue-on-error: true
        run: npm run security:deps

      # The SECRET scan is blocking, and it runs inside `npm run verify` too.
      # Named separately here so a failure reads as a secret leak rather than as
      # "the test suite failed".
      - name: Secret scan (blocking)
        run: npm run security:secrets

      - name: Release summary
        id: summary
        run: npm run release:summary

      # A gate must fail only for reasons that matter (TAB 03).
      #
      # `release:summary` runs late, so ANY earlier failure means the file was
      # never written — and `if-no-files-found: error` then failed the upload
      # too. The run's visible cause of death became "no artifact" rather than
      # the drift or secret or test that actually stopped it. That is worse than
      # cosmetic: a gate that fails for uninteresting reasons trains everyone to
      # ignore it, and then it fails for a real reason and is ignored too.
      #
      # This writes a minimal summary naming the step that failed, so the
      # artifact always exists and always says something true. `reports/` is
      # gitignored, so the hermeticity check below is unaffected.
      - name: Summary fallback, so the artifact is never the cause of failure
        if: always()
        run: |
          mkdir -p reports
          if [ ! -f reports/release-summary.json ]; then
            cat > reports/release-summary.json <<JSON
          {
            "verdict": "BLOCKED",
            "reason": "the gate failed before release:summary could run",
            "note": "This file is a FALLBACK. The real cause is the first failed step in this run; read the log, not this verdict.",
            "commit": "${GITHUB_SHA}",
            "run": "${GITHUB_RUN_ID}",
            "summaryStepOutcome": "${{ steps.summary.outcome }}"
          }
          JSON
            echo "::warning::release:summary did not run; wrote a fallback summary."
          fi

      - name: Retain the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: reports/release-summary.json
          # Stays `error`: the step above guarantees the file exists, so a
          # missing artifact now means the fallback itself did not run, which is
          # a real fault worth failing on.
          if-no-files-found: error
          retention-days: 30

      # The gate must not leave anything behind in a tracked directory.
      # `tests/release-gate-hermeticity.test.ts` asserts this statically; this
      # proves it dynamically, on a real clean checkout.
      - name: Working tree is still clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the gate wrote into the working tree:"
            git status --porcelain
            exit 1
          fi
