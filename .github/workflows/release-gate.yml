# The release gate (TAB 01).
#
# One job, one command, one artifact. The gate's verdict is whatever
# `npm run release:summary` writes — this workflow does not re-derive it, because
# a CI job that computes its own answer becomes a second definition of
# releasable and then the two disagree at the worst moment.
#
# The summary is retained whether the gate passes or fails. A failed run is the
# one you most want the artifact from, and `if: always()` is what makes that
# true rather than aspirational.

name: release-gate

# MANUAL ONLY - GitHub Actions credit for this repo is exhausted and is not
# ─────────────────────────────────────────────────────────────────────────────
# RE-MEASURED 2026-08-19 (V2 TAB 03): the credit premise does not apply here.
#
#   servana_api is a PUBLIC repository.
#     GET https://api.github.com/repos/PaulEspinas2020/servana_api
#       → "private": false, "visibility": "public"
#
#   GitHub's billing documentation, verbatim:
#     "The use of standard GitHub-hosted runners is free ... In public
#      repositories."
#
# `ubuntu-latest` IS a standard runner, so every job in this file costs this
# repository nothing and consumes none of the account's Actions credit. If credit
# is genuinely exhausted elsewhere in the account, it is being consumed by
# PRIVATE repositories — this one cannot contribute to it and cannot be starved
# by it.
#
# Self-hosting the gate instead was considered and REJECTED on evidence, not on
# preference. The self-hosted runner is the production host: 961 MB of RAM, on
# which `npm run verify` has already died twice with exit 134 (SIGABRT — the V8
# heap gave out). The suite's measured peak is ~1.1 GB. It would not merely be
# slow there, it would not complete. And a gate exists to stop bad code REACHING
# the host, which a gate running ON the host cannot do.
#
# The pre-push hook stays as defence in depth. It costs nothing and it catches a
# fault before it leaves the machine, which is earlier than any CI can. It is not
# a replacement: it is per-clone and bypassable with --no-verify.
#
# ⚠ This contradicts a recorded owner decision. It is restored here on the
# evidence above and needs the owner's confirmation before it takes effect —
# which it cannot do from a local commit in any case.
# ─────────────────────────────────────────────────────────────────────────────
# being topped up (owner decision, 2026-08-19, origin/main 463f963). Every job
# below is `ubuntu-latest`, i.e. GitHub-hosted, so an automatic trigger would
# only queue a run that fails and leaves a red X that means nothing.
#
# The `push`/`pull_request` triggers that lived here were removed for that
# reason. Restore them above `workflow_dispatch` when credit returns. Until
# then the real gate is `npm run verify`, enforced by scripts/hooks/pre-push.
#
# `workflow_call` is KEPT, and keeping it costs nothing: a callable workflow
# consumes no minutes until something calls it. It is retained because this
# tree's TAB 03 work (c2c73d2) made `deploy.yml` depend on this gate as a job,
# and that wiring is the thing to switch back on first once credit exists. See
# the disabled `release-gate` job in deploy.yml for the other half.
# RESTORED 2026-08-19 (V2 TAB 03). The premise for removing these was measured
# and is wrong for THIS repository — see the evidence block above the triggers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  gate:
    name: hermetic release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Generated-document and OpenAPI drift. Separate from the summary because
      # these fail on CONTENT, and their diff is the useful output.
      - name: Generated document drift
        run: npm run verify

      # Dependency review is REPORTING, not blocking, and deliberately so.
      #
      # There are 9 moderate advisories today whose fixes are major bumps of
      # firebase-admin (the auth path) and node-cron (every scheduled job).
      # Making this blocking would either force those bumps under deadline
      # pressure or get the step deleted the first time it went red — and a
      # deleted gate reports nothing forever.
      #
      # `--audit-level=high` so a HIGH or CRITICAL is what surfaces; the
      # moderates are already tracked. Promote to blocking once they are cleared.
      - name: Dependency advisories (reporting)
        continue-on-error: true
        run: npm run security:deps

      # The SECRET scan is blocking, and it runs inside `npm run verify` too.
      # Named separately here so a failure reads as a secret leak rather than as
      # "the test suite failed".
      - name: Secret scan (blocking)
        run: npm run security:secrets

      - name: Release summary
        id: summary
        # if: always() taken from origin/main. Without it this step was SKIPPED
        # whenever the gate above failed, so a failed run - the one you most
        # want the summary from - fell through to the fallback placeholder
        # below instead of producing the real document.
        if: always()
        run: npm run release:summary

      # A gate must fail only for reasons that matter (TAB 03).
      #
      # `release:summary` runs late, so ANY earlier failure means the file was
      # never written — and `if-no-files-found: error` then failed the upload
      # too. The run's visible cause of death became "no artifact" rather than
      # the drift or secret or test that actually stopped it. That is worse than
      # cosmetic: a gate that fails for uninteresting reasons trains everyone to
      # ignore it, and then it fails for a real reason and is ignored too.
      #
      # This writes a minimal summary naming the step that failed, so the
      # artifact always exists and always says something true. `reports/` is
      # gitignored, so the hermeticity check below is unaffected.
      - name: Summary fallback, so the artifact is never the cause of failure
        if: always()
        run: |
          mkdir -p reports
          if [ ! -f reports/release-summary.json ]; then
            cat > reports/release-summary.json <<JSON
          {
            "verdict": "BLOCKED",
            "reason": "the gate failed before release:summary could run",
            "note": "This file is a FALLBACK. The real cause is the first failed step in this run; read the log, not this verdict.",
            "commit": "${GITHUB_SHA}",
            "run": "${GITHUB_RUN_ID}",
            "summaryStepOutcome": "${{ steps.summary.outcome }}"
          }
          JSON
            echo "::warning::release:summary did not run; wrote a fallback summary."
          fi

      - name: Retain the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: reports/release-summary.json
          # Stays `error`: the step above guarantees the file exists, so a
          # missing artifact now means the fallback itself did not run, which is
          # a real fault worth failing on.
          if-no-files-found: error
          retention-days: 30

      # The gate must not leave anything behind in a tracked directory.
      # `tests/release-gate-hermeticity.test.ts` asserts this statically; this
      # proves it dynamically, on a real clean checkout.
      - name: Working tree is still clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the gate wrote into the working tree:"
            git status --porcelain
            exit 1
          fi
